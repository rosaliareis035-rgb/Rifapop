name: Montar imagem do prêmio RifaPop

on:
  push:
    paths:
      - 'assets/rifapop-image-b64/**'
      - '.github/workflows/assemble-rifapop-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Montar imagem WebP
        shell: bash
        run: |
          mkdir -p assets/rifapop-image-b64
          cat assets/rifapop-image-b64/01.txt \
              assets/rifapop-image-b64/02.txt \
              assets/rifapop-image-b64/03.txt \
              assets/rifapop-image-b64/04.txt \
              assets/rifapop-image-b64/05.txt \
              assets/rifapop-image-b64/06.txt \
              assets/rifapop-image-b64/07.txt \
              assets/rifapop-image-b64/08.txt \
              assets/rifapop-image-b64/09.txt \
            | tr -d '\r\n' \
            | base64 -d > premio-rifapop-novo.webp
          file premio-rifapop-novo.webp
          test -s premio-rifapop-novo.webp

      - name: Salvar imagem e limpar partes
        shell: bash
        run: |
          rm -rf assets/rifapop-image-b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premio-rifapop-novo.webp assets/rifapop-image-b64 || true
          git commit -m 'Adicionar nova imagem do prêmio RifaPop' || echo 'Nada novo para commitar'
          git push
