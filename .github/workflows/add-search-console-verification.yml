name: Adicionar verificação do Google Search Console

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Adicionar meta tag do Search Console
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="XC9cOcy9w2S5CW_KSkA08rkmBbKiOByKBKF35316WCo" />'
          if 'google-site-verification' not in s:
              s = s.replace('<meta name="robots" content="index, follow">', '<meta name="robots" content="index, follow">' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          if git diff --quiet; then
            echo "A tag já está presente. Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar meta tag do Google Search Console"
          git push